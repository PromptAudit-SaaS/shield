name: Bug report
description: Report a reproducible problem using fictional data only.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never post real keys, personal data or memory dumps. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Package/version, OS, Node or Bun version, and client/version if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Fictional reproduction
      description: Minimal input and exact steps; redact paths and identifiers before posting.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and observed result
      description: Include sanitized errors; a missed pattern is not proof of universal failure.
    validations:
      required: true
